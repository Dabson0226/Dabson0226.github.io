<!DOCTYPE html>
<html>

<head>
    <title>Lab 5 - JavaScript Registration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>

<body>

    <div class="container">

        <div class="jumbotron">
            <h1>Welcome to My Online Store</h1>
            <p>Create an account to get started!</p>
        </div>

        <h2>Customer Registration</h2>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" class="form-control" id="firstName">
            </div>

            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" class="form-control" id="lastName">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" class="form-control" id="email">
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" class="form-control" id="password">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" class="form-control" id="dob">
            </div>

            <button type="submit" class="btn btn-primary">Register</button>

        </form>

        <h2>Registration Results</h2>
        <div id="result" aria-live="polite"></div>

    </div>

    <script>
        // Get the registration form
        let form = document.getElementById("registrationForm");

        // Run when the customer clicks Register
        form.addEventListener("submit", function(event) {

            // Prevent the page from refreshing
            event.preventDefault();

            let result = document.getElementById("result");

            // Create a User Object
            let user = {
                firstName: document.getElementById("firstName").value,
                lastName: document.getElementById("lastName").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                dob: document.getElementById("dob").value
            };

            // Check if any fields are empty
            if (user.firstName.trim() === "" ||
                user.lastName.trim() === "" ||
                user.email.trim() === "" ||
                user.password === "" ||
                user.dob === "") {

                result.textContent =
                    "Registration Failed: Please fill out all fields.";

                result.className = "alert alert-danger";
            }
            // Check if password contains ! or ?
            else if (!user.password.includes("!") &&
                     !user.password.includes("?")) {

                result.textContent =
                    "Registration Failed: Password must contain ! or ?";

                result.className = "alert alert-danger";
            }
            else {

                // Replace password with asterisks
                user.password = "*".repeat(user.password.length);

                // Display successful registration
                result.className = "alert alert-success";

                result.innerHTML =
                    "<h3>Registration Successful!</h3>" +
                    "<p>First Name: <span id='showFirst'></span></p>" +
                    "<p>Last Name: <span id='showLast'></span></p>" +
                    "<p>Email: <span id='showEmail'></span></p>" +
                    "<p>Password: <span id='showPassword'></span></p>" +
                    "<p>Date of Birth: <span id='showDob'></span></p>";

                document.getElementById("showFirst").textContent = user.firstName;
                document.getElementById("showLast").textContent = user.lastName;
                document.getElementById("showEmail").textContent = user.email;
                document.getElementById("showPassword").textContent = user.password;
                document.getElementById("showDob").textContent = user.dob;
            }

        });
    </script>

</body>
</html>
