<!DOCTYPE html>
<html>
<head>
    <title>Lab 6 - Consuming a REST API</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <h1>Cat Facts</h1>
    <p>Click to load cat facts</p>

    <img id="catPicture" src="cat.jpg" alt="A cat" width="300">

    <br><br>
    <button onclick="loadCatFacts()">Load Cat Facts</button>
    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>factId</th>
                <th>fact</th>
            </tr>
        </thead>

        <tbody id="factsTable"> </tbody>
    </table>

    <script>
    function loadCatFacts() {
        fetch("https://brianobruno.github.io/cats.json", {
            method: "GET"
        })
        .then(function(response)
        {
            return response.json();
        })
        .then(function(data)
        {
            data.facts.sort(function(a, b)
            {
                return a.factId - b.factId;
            });

        let table = document.getElementById("factsTable");
        table.innerHTML = "";

        data.facts.forEach(function(fact) 
        {
            let row = table.insertRow();
            let idCell = row.insertCell();
            let factCell = row.insertCell();

            idCell.textContent = fact.factId;
            factCell.textContent = fact.text;
        });

        document.getElementById("catPicture").src = data.catPhoto;
        })
        .catch(function(error)
        {
            console.log("Could not load cat facts:", error);
        });
    }
</script>

</body>
</html>
